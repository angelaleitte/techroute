<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">TechRoute  esquema do banco SQLite</title>
  <desc id="desc">Diagrama ER: technicians e service_types (1) relacionam-se com appointments (N). Cores Lime Night.</desc>

  <defs>
    <!-- Crow's foot: lado N (muitos)  apontando para a esquerda -->
    <marker id="crow-left" markerWidth="14" markerHeight="14" refX="1" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M13 1 L1 7 L13 13" fill="none" stroke="#5a5f68" stroke-width="1.5"/>
      <circle cx="4" cy="7" r="1.6" fill="none" stroke="#5a5f68" stroke-width="1.2"/>
    </marker>
    <!-- Crow's foot: lado N  apontando para a direita -->
    <marker id="crow-right" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L13 7 L1 13" fill="none" stroke="#5a5f68" stroke-width="1.5"/>
      <circle cx="10" cy="7" r="1.6" fill="none" stroke="#5a5f68" stroke-width="1.2"/>
    </marker>
    <!-- Lado 1: barra dupla -->
    <marker id="one-bar" markerWidth="10" markerHeight="12" refX="5" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <line x1="3" y1="1" x2="3" y2="11" stroke="#5a5f68" stroke-width="1.5"/>
      <line x1="7" y1="1" x2="7" y2="11" stroke="#5a5f68" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Fundo suave (tema claro do DS) -->
  <rect width="920" height="560" fill="#f3f5f2"/>

  <!-- ========== technicians (esquerda) ========== -->
  <g id="table-technicians">
    <rect x="40" y="40" width="220" height="168" rx="2" fill="#ffffff" stroke="#9aa8c0" stroke-width="1.5"/>
    <rect x="40" y="40" width="220" height="32" fill="#ccff00"/>
    <text x="150" y="61" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0b0c0f">technicians</text>
    <!-- PK -->
    <rect x="52" y="84" width="22" height="14" rx="2" fill="#0b0c0f"/>
    <text x="63" y="95" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#ccff00">PK</text>
    <text x="82" y="95" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">id</text>
    <!-- separator pontilhado -->
    <line x1="52" y1="108" x2="248" y2="108" stroke="#9aa8c0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="52" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">name</text>
    <text x="52" y="150" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">specialty</text>
    <text x="52" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">active</text>
  </g>

  <!-- ========== service_types (direita) ========== -->
  <g id="table-service-types">
    <rect x="660" y="40" width="220" height="146" rx="2" fill="#ffffff" stroke="#9aa8c0" stroke-width="1.5"/>
    <rect x="660" y="40" width="220" height="32" fill="#ccff00"/>
    <text x="770" y="61" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0b0c0f">service_types</text>
    <rect x="672" y="84" width="22" height="14" rx="2" fill="#0b0c0f"/>
    <text x="683" y="95" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#ccff00">PK</text>
    <text x="702" y="95" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">id</text>
    <line x1="672" y1="108" x2="868" y2="108" stroke="#9aa8c0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="672" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">name</text>
    <text x="672" y="150" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">description</text>
  </g>

  <!-- ========== appointments (centro inferior) ========== -->
  <g id="table-appointments">
    <rect x="280" y="250" width="360" height="280" rx="2" fill="#ffffff" stroke="#9aa8c0" stroke-width="1.5"/>
    <rect x="280" y="250" width="360" height="32" fill="#ccff00"/>
    <text x="460" y="271" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0b0c0f">appointments</text>
    <rect x="292" y="294" width="22" height="14" rx="2" fill="#0b0c0f"/>
    <text x="303" y="305" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#ccff00">PK</text>
    <text x="322" y="305" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">id</text>
    <line x1="292" y1="318" x2="628" y2="318" stroke="#9aa8c0" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="292" y="338" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">client_name</text>
    <text x="292" y="358" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">location · phone · phone_secondary · email</text>
    <text x="292" y="378" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">visit_date · visit_time</text>
    <!-- FKs -->
    <rect x="292" y="392" width="22" height="14" rx="2" fill="#3d6b00"/>
    <text x="303" y="403" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#ccff00">FK</text>
    <text x="322" y="403" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">technician_id ’ technicians</text>
    <rect x="292" y="416" width="22" height="14" rx="2" fill="#3d6b00"/>
    <text x="303" y="427" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#ccff00">FK</text>
    <text x="322" y="427" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">service_type_id ’ service_types</text>
    <text x="292" y="450" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">notes · resource_ids</text>
    <text x="292" y="470" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">status · cancellation_reason · cancelled_at</text>
    <text x="292" y="490" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">created_at · updated_at</text>
  </g>

  <!-- Relação technicians (1) < appointments (N) -->
  <path
    d="M150 208 L150 230 L280 230 L280 294"
    fill="none"
    stroke="#5a5f68"
    stroke-width="1.5"
    marker-start="url(#one-bar)"
    marker-end="url(#crow-right)"
  />
  <text x="170" y="224" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#6e727a">1 : N</text>

  <!-- Relação service_types (1) < appointments (N) -->
  <path
    d="M770 186 L770 230 L640 230 L640 294"
    fill="none"
    stroke="#5a5f68"
    stroke-width="1.5"
    marker-start="url(#one-bar)"
    marker-end="url(#crow-left)"
  />
  <text x="690" y="224" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#6e727a">1 : N</text>

  <!-- Legenda -->
  <g transform="translate(40, 520)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#0b0c0f"/>
    <text x="7" y="11" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="7" font-weight="700" fill="#ccff00">PK</text>
    <text x="22" y="11" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#0a0c10">chave primária</text>
    <rect x="140" y="0" width="14" height="14" rx="2" fill="#3d6b00"/>
    <text x="147" y="11" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="7" font-weight="700" fill="#ccff00">FK</text>
    <text x="162" y="11" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#0a0c10">chave estrangeira</text>
    <text x="320" y="11" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#6e727a">Lime Night · SQLite · TechRoute</text>
  </g>
</svg>
