<svg xmlns="http://www.w3.org/2000/svg" width="980" height="920" viewBox="0 0 980 920" role="img" aria-labelledby="title desc">
  <title id="title">TechRoute - esquema do banco SQLite (v3.1)</title>
  <desc id="desc">Diagrama ER com users, sessions, appointment_events e junção N:N de recursos.</desc>
  <rect width="980" height="920" fill="#f3f5f2"/>

  <!-- users: x=40 y=30 w=240 h=170 -->
  <g id="users">
    <rect x="40" y="30" width="240" height="170" rx="6" fill="#fff" stroke="#9aa8c0" stroke-width="1.5"/>
    <rect x="40" y="30" width="240" height="32" fill="#ccff00"/>
    <text x="160" y="51" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0b0c0f">users</text>
    <rect x="52" y="76" width="22" height="14" rx="2" fill="#0b0c0f"/>
    <text x="63" y="87" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#ccff00">PK</text>
    <text x="82" y="87" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">id</text>
    <line x1="52" y1="100" x2="268" y2="100" stroke="#c5ccd6" stroke-dasharray="3 3"/>
    <text x="52" y="120" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">username / password_hash</text>
    <text x="52" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">display_name / role / active</text>
    <rect x="52" y="154" width="22" height="14" rx="2" fill="#3d6b00"/>
    <text x="63" y="165" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#ccff00">FK</text>
    <text x="82" y="165" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">technician_id (opc.)</text>
  </g>

  <!-- sessions: x=320 y=30 w=220 h=130 -->
  <g id="sessions">
    <rect x="320" y="30" width="220" height="130" rx="6" fill="#fff" stroke="#9aa8c0" stroke-width="1.5"/>
    <rect x="320" y="30" width="220" height="32" fill="#ccff00"/>
    <text x="430" y="51" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0b0c0f">sessions</text>
    <rect x="332" y="76" width="22" height="14" rx="2" fill="#0b0c0f"/>
    <text x="343" y="87" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#ccff00">PK</text>
    <text x="362" y="87" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">token</text>
    <line x1="332" y1="100" x2="528" y2="100" stroke="#c5ccd6" stroke-dasharray="3 3"/>
    <rect x="332" y="114" width="22" height="14" rx="2" fill="#3d6b00"/>
    <text x="343" y="125" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#ccff00">FK</text>
    <text x="362" y="125" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">user_id -&gt; users</text>
    <text x="332" y="148" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">expires_at / created_at</text>
  </g>

  <!-- technicians: x=580 y=30 w=180 h="150" -->
  <g id="technicians">
    <rect x="580" y="30" width="180" height="150" rx="6" fill="#fff" stroke="#9aa8c0" stroke-width="1.5"/>
    <rect x="580" y="30" width="180" height="32" fill="#ccff00"/>
    <text x="670" y="51" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0b0c0f">technicians</text>
    <rect x="592" y="76" width="22" height="14" rx="2" fill="#0b0c0f"/>
    <text x="603" y="87" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#ccff00">PK</text>
    <text x="622" y="87" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">id</text>
    <line x1="592" y1="100" x2="748" y2="100" stroke="#c5ccd6" stroke-dasharray="3 3"/>
    <text x="592" y="120" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">name</text>
    <text x="592" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">specialty</text>
    <text x="592" y="160" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">active</text>
  </g>

  <!-- service_types: x=780 y=30 w="180" h="130" -->
  <g id="service_types">
    <rect x="780" y="30" width="180" height="130" rx="6" fill="#fff" stroke="#9aa8c0" stroke-width="1.5"/>
    <rect x="780" y="30" width="180" height="32" fill="#ccff00"/>
    <text x="870" y="51" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0b0c0f">service_types</text>
    <rect x="792" y="76" width="22" height="14" rx="2" fill="#0b0c0f"/>
    <text x="803" y="87" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#ccff00">PK</text>
    <text x="822" y="87" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">id</text>
    <line x1="792" y1="100" x2="948" y2="100" stroke="#c5ccd6" stroke-dasharray="3 3"/>
    <text x="792" y="120" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">name</text>
    <text x="792" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">description</text>
  </g>

  <!-- appointments: x=240 y=260 w="500" h="250" -->
  <g id="appointments">
    <rect x="240" y="260" width="500" height="250" rx="6" fill="#fff" stroke="#9aa8c0" stroke-width="1.5"/>
    <rect x="240" y="260" width="500" height="32" fill="#ccff00"/>
    <text x="490" y="281" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0b0c0f">appointments</text>
    <rect x="252" y="306" width="22" height="14" rx="2" fill="#0b0c0f"/>
    <text x="263" y="317" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#ccff00">PK</text>
    <text x="282" y="317" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">id</text>
    <line x1="252" y1="330" x2="728" y2="330" stroke="#c5ccd6" stroke-dasharray="3 3"/>
    <text x="252" y="350" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">client_name / contacts / location</text>
    <text x="252" y="370" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">visit_date / visit_time / notes</text>
    <rect x="252" y="384" width="22" height="14" rx="2" fill="#3d6b00"/>
    <text x="263" y="395" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#ccff00">FK</text>
    <text x="282" y="395" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">technician_id -&gt; technicians</text>
    <rect x="252" y="408" width="22" height="14" rx="2" fill="#3d6b00"/>
    <text x="263" y="419" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#ccff00">FK</text>
    <text x="282" y="419" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">service_type_id -&gt; service_types</text>
    <text x="252" y="448" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">status / attended_at / post_visit_notes</text>
    <text x="252" y="468" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">cancel / reschedule reasons + timestamps</text>
    <text x="252" y="488" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">created_at / updated_at</text>
  </g>

  <!-- appointment_events: x=40 y=560 w="280" h="170" -->
  <g id="appointment_events">
    <rect x="40" y="560" width="280" height="170" rx="6" fill="#fff" stroke="#9aa8c0" stroke-width="1.5"/>
    <rect x="40" y="560" width="280" height="32" fill="#ccff00"/>
    <text x="180" y="581" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0b0c0f">appointment_events</text>
    <rect x="52" y="606" width="22" height="14" rx="2" fill="#0b0c0f"/>
    <text x="63" y="617" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#ccff00">PK</text>
    <text x="82" y="617" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">id</text>
    <line x1="52" y1="630" x2="308" y2="630" stroke="#c5ccd6" stroke-dasharray="3 3"/>
    <rect x="52" y="644" width="22" height="14" rx="2" fill="#3d6b00"/>
    <text x="63" y="655" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#ccff00">FK</text>
    <text x="82" y="655" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">appointment_id</text>
    <text x="52" y="684" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">event_type / reason / slots</text>
    <text x="52" y="704" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">user_id / actor_name / created_at</text>
  </g>

  <!-- appointment_resources: x="360" y="580" w="300" h="100" -->
  <g id="appointment_resources">
    <rect x="360" y="580" width="300" height="100" rx="6" fill="#fff" stroke="#9aa8c0" stroke-width="1.5"/>
    <rect x="360" y="580" width="300" height="32" fill="#ccff00"/>
    <text x="510" y="601" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0b0c0f">appointment_resources</text>
    <rect x="372" y="626" width="22" height="14" rx="2" fill="#3d6b00"/>
    <text x="383" y="637" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#ccff00">FK</text>
    <text x="402" y="637" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">appointment_id</text>
    <rect x="372" y="650" width="22" height="14" rx="2" fill="#3d6b00"/>
    <text x="383" y="661" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#ccff00">FK</text>
    <text x="402" y="661" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">resource_id</text>
  </g>

  <!-- resources: x="700" y="560" w="220" h="140" -->
  <g id="resources">
    <rect x="700" y="560" width="220" height="140" rx="6" fill="#fff" stroke="#9aa8c0" stroke-width="1.5"/>
    <rect x="700" y="560" width="220" height="32" fill="#ccff00"/>
    <text x="810" y="581" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0b0c0f">resources</text>
    <rect x="712" y="606" width="22" height="14" rx="2" fill="#0b0c0f"/>
    <text x="723" y="617" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="8" font-weight="700" fill="#ccff00">PK</text>
    <text x="742" y="617" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">id</text>
    <line x1="712" y1="630" x2="908" y2="630" stroke="#c5ccd6" stroke-dasharray="3 3"/>
    <text x="712" y="650" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">name</text>
    <text x="712" y="670" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#0a0c10">category / description</text>
  </g>

  <!-- LINHAS -->
  <g stroke="#5a5f68" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- users -> sessions -->
    <path d="M280 95 L320 95"/>
    <!-- users -> technicians (technician_id opcional) -->
    <path d="M160 200 L160 220 L670 220 L670 180"/>
    <!-- technicians -> appointments -->
    <path d="M670 180 L670 230 L400 230 L400 260"/>
    <!-- service_types -> appointments -->
    <path d="M870 160 L870 230 L580 230 L580 260"/>
    <!-- appointments -> appointment_events -->
    <path d="M300 510 L300 540 L180 540 L180 560"/>
    <!-- appointments -> appointment_resources -->
    <path d="M490 510 L490 580"/>
    <!-- resources -> appointment_resources -->
    <path d="M700 630 L660 630"/>
  </g>

  <g fill="#5a5f68">
    <circle cx="280" cy="95" r="3.5"/>
    <circle cx="320" cy="95" r="3.5"/>
    <circle cx="160" cy="200" r="3.5"/>
    <circle cx="670" cy="180" r="3.5"/>
    <circle cx="400" cy="260" r="3.5"/>
    <circle cx="580" cy="260" r="3.5"/>
    <circle cx="300" cy="510" r="3.5"/>
    <circle cx="180" cy="560" r="3.5"/>
    <circle cx="490" cy="510" r="3.5"/>
    <circle cx="490" cy="580" r="3.5"/>
    <circle cx="700" cy="630" r="3.5"/>
    <circle cx="660" cy="630" r="3.5"/>
  </g>

  <!-- cardinalidade -->
  <text x="288" y="88" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#6e727a">1 : N</text>
  <text x="300" y="214" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#6e727a">users → technicians (0..1)</text>
  <text x="410" y="248" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#6e727a">1 : N</text>
  <text x="590" y="248" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#6e727a">1 : N</text>
  <text x="190" y="552" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#6e727a">1 : N histórico</text>
  <text x="500" y="548" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#6e727a">1 : N</text>
  <text x="668" y="622" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#6e727a">N</text>
  <text x="510" y="710" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#6e727a">N : N appointments ↔ resources via appointment_resources</text>

  <!-- legenda -->
  <g transform="translate(40, 870)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#0b0c0f"/>
    <text x="7" y="11" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="7" font-weight="700" fill="#ccff00">PK</text>
    <text x="22" y="11" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#0a0c10">chave primaria</text>
    <rect x="140" y="0" width="14" height="14" rx="2" fill="#3d6b00"/>
    <text x="147" y="11" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="7" font-weight="700" fill="#ccff00">FK</text>
    <text x="162" y="11" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#0a0c10">chave estrangeira</text>
    <text x="320" y="11" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#6e727a">1 = um · N = muitos · Lime Night / SQLite · v3.1</text>
  </g>
</svg>
